<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    Saber+ — Preparación ICFES Saber 11 (Flutter Web)

    Compilación:
      flutter build web --release --base-href /ruta/   (si se sirve en subruta)
      flutter build web --release                       (si se sirve en raíz)
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- SEO / social -->
  <meta name="description" content="Saber+ — Preparación ICFES Saber 11: cursos, simulacros, retos 1v1, gamificación y tutor con IA. Prepárate para el examen más importante de tu vida académica.">
  <meta name="theme-color" content="#1E4ED8">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Saber+">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Saber+ — Preparación ICFES Saber 11</title>
  <link rel="manifest" href="manifest.json">

  <!-- Splash de carga (v1.6.0): visible hasta que Flutter toma el control -->
  <style>
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #1E4ED8 0%, #16307F 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      z-index: 9999;
      transition: opacity .4s ease;
    }
    #splash .logo {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1px;
    }
    #splash .logo span { color: #FACC15; }
    #splash .tagline {
      margin-top: 8px;
      font-size: 15px;
      opacity: .85;
    }
    #splash .spinner {
      margin-top: 28px;
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255,255,255,.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #splash.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo">Saber<span>+</span></div>
    <div class="tagline">Preparación ICFES Saber 11</div>
    <div class="spinner"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@2.12.313/build/pdf.js" type="text/javascript"></script>
  <script type="text/javascript">
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@2.12.313/build/pdf.worker.min.js";
    pdfRenderOptions = {
      cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@2.12.313/cmaps/',
      cMapPacked: true,
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>

  <!-- Oculta el splash cuando Flutter ya renderizó su primer frame -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) {
        s.classList.add('hidden');
        setTimeout(function () { s.remove(); }, 500);
      }
    });
  </script>
</body>
</html>
