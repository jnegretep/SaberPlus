name: saberplus_app
description: Saber+ — Preparación ICFES Saber 11 | Cursos, Simulacros, Retos y IA
publish_to: 'none'
version: 2.0.1+25

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
    
    
  flutter_localizations:      # ✅ FASE 2.3: locale es_CO para DatePicker, Material widgets
    sdk: flutter  

  # ── Estado & Navegación ──
  provider: ^6.1.2
  go_router: ^14.6.2

  # ── Red & API ──
  dio: ^5.9.0
  connectivity_plus: ^7.0.0
  http: 1.2.2            # todavía usado por api_service.dart (migración gradual a dio)
  confetti: ^0.7.0
  # ── Almacenamiento & Seguridad ──
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.2.2
  flutter_dotenv: ^5.2.1
  path_provider: ^2.1.5
  device_info_plus: ^10.1.2

  # ── UI & Visualización ──
  flutter_svg: ^2.0.9
  flutter_html: ^3.0.0
  flutter_math_fork: ^0.7.4
  flutter_widget_from_html_core: ^0.16.0
  photo_view: ^0.15.0      # ✅ Actualizado para ser compatible con pdfx
  shimmer: ^3.0.0
  phosphor_flutter: ^2.1.0
  animations: ^2.0.11
  percent_indicator: ^4.2.5
  fl_chart: ^1.1.1
  syncfusion_flutter_charts: ^32.1.24

  # ── PDF & Documentos ──
  pdfx: ^2.7.0             # ✅ Actualizado para resolver el conflicto de device_info_plus
  flutter_pdfview: ^1.3.2
  open_filex: ^4.0.0

  # ── Video ──
  video_player: ^2.10.0
  video_player_web: ^2.0.20
  chewie: ^1.8.1

  # ── Web ──
  webview_flutter: ^4.7.0
  url_launcher: ^6.2.5

  # ── HTML parsing (contenido Moodle: preguntas, tablas, imágenes) ──
  html: ^0.15.4

  # ── Multimedia ──
  image_picker: ^1.1.2
  cross_file: ^0.3.3+2        # XFile de image_picker — usado por el io_shim/web (v1.6.1)
  permission_handler: ^12.0.1
  flutter_downloader: ^1.11.6

  # ── Utilidades ──
  intl: ^0.20.2
  logger: ^2.5.0
  cached_network_image: ^3.4.0

  # ── Firebase (v2.0.1: versiones desacopladas de KGP, compatibles con Flutter 3.44+) ──
  firebase_core: ^5.1.0
  firebase_analytics: ^13.0.1
  firebase_crashlytics: ^6.0.1
  firebase_messaging: ^17.0.1

  # ── Social (v1.6.0) ──
  share_plus: ^10.1.4           # v1.7.0: API SharePlus.instance/ShareParams (10.x) + compartir logo adjunto

  # ── Auth adicional (FIX #4 y #5) ──
  google_sign_in: ^6.2.1
  local_auth: ^2.2.0

  # ── Pagos (v1.7.0) ──
  in_app_purchase: ^3.2.0   # Google Play Billing (Android); web sigue con Wompi

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints_plus: ^2.1.0

flutter:
  uses-material-design: true

  assets:
    - .env  # ⚠️ SECURITY: .env se empaqueta en el APK. Migrar a compile-time env en Fase 2.
    - assets/images/cards/
    - assets/images/saberplus.png
    - assets/images/welcome1.png
    - assets/images/welcome2.png
    - assets/images/google.png
    - assets/logo.png
    - assets/images/background_teal.png
    - assets/images/prepsaber_logo.png
    - assets/images/student_reading.png
    - assets/avatars/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"