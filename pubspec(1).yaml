name: saberplus_app
description: Saber+ — Preparación ICFES Saber 11 | Cursos, Simulacros, Retos y IA
publish_to: 'none'
version: 1.5.0+15

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Estado & Navegación ──
  provider: ^6.1.2
  go_router: ^14.6.2

  # ── Red & API ──
  dio: ^5.9.0
  connectivity_plus: ^5.0.2
  http: 1.2.2            # mantener mientras auth_service lo usa (migrar a dio en fase 2)

  # ── Almacenamiento & Seguridad ──
  flutter_secure_storage: ^8.0.0
  shared_preferences: ^2.2.2
  flutter_dotenv: ^5.2.1
  path_provider: ^2.1.5

  # ── UI & Visualización ──
  flutter_svg: ^2.0.9
  flutter_html: ^3.0.0
  flutter_math_fork: ^0.7.2
  flutter_widget_from_html_core: ^0.16.0
  photo_view: ^0.14.0
  shimmer: ^3.0.0
  phosphor_flutter: ^2.1.0
  animations: ^2.0.11
  percent_indicator: ^4.2.5
  fl_chart: ^1.1.1
  syncfusion_flutter_charts: ^32.1.24

  # ── PDF & Documentos ──
  pdfx: ^2.6.0
  flutter_pdfview: ^1.3.2
  open_filex: ^4.0.0

  # ── Video ──
  video_player: ^2.10.0
  video_player_web: ^2.0.20
  chewie: ^1.8.1

  # ── Web ──
  webview_flutter: ^4.7.0
  url_launcher: ^6.2.5

  # ── Multimedia ──
  image_picker: ^1.1.2
  permission_handler: ^12.0.1

  # ── Utilidades ──
  intl: ^0.20.2
  logger: ^2.5.0
  cached_network_image: ^3.4.0

  # ── Firebase ──
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints_plus: ^2.1.0

flutter:
  uses-material-design: true

  assets:
    - .env  # ⚠️ SECURITY: .env se empaqueta en el APK. Migrar a compile-time env en Fase 2.
    - assets/images/cards/
    - assets/images/saberplus.png
    - assets/images/welcome1.png
    - assets/images/welcome2.png
    - assets/images/google.png
    - assets/logo.png
    - assets/images/background_teal.png
    - assets/images/prepsaber_logo.png
    - assets/images/student_reading.png
    - assets/avatars/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
